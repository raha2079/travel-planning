[project]
name = "travel-planning"
version = "0.1.0"
description = "Travel planning plugin for nanoagent - select flight and hotel within budget"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # nanoagent is provided by the RUSH Lab runtime environment
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
